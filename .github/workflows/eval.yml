name: Eval suite

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # TEMPORARY — diagnosing why CI's retrieval-hit rate (70.7%) doesn't
      # match the identical code/config run fresh locally on Windows (97.6%).
      # Every CI miss is from a PDF-sourced document, never an HTML one, which
      # points at pymupdf extracting PDF text differently on Linux vs Windows,
      # misaligning contextual headers (matched by chunk_index). This step
      # prints extraction fingerprints to confirm — remove once confirmed, see
      # EVALUATION_HISTORY.md Step 15 follow-up.
      - name: DEBUG - PDF extraction fingerprint
        run: python -m eval.debug_pdf_extraction_diagnostic

      - name: Ingest corpus into local Qdrant
        run: python -m app.pipelines.plain.ingestion
        env:
          EMBEDDING_BACKEND: local
          RETRIEVAL_MODE: hybrid
          USE_CONTEXTUAL_HEADERS: "true"

      # Groq-free, deterministic, no API key needed — see DECISIONS.md
      # ("Groq restricted to generation only"). Full LLM-judged quality eval
      # (faithfulness, answer correctness, etc.) is a separate manual process
      # via eval/export_for_external_judge.py, not run in CI.
      #
      # USE_CONTEXTUAL_HEADERS must match the ingestion step above: headers
      # are baked into the embedded text at ingestion time, not applied at
      # query time, so this step doesn't strictly need the flag to retrieve
      # correctly — it's set here anyway so the two steps' config can never
      # silently drift apart again (this exact drift caused a CI regression,
      # see EVALUATION_HISTORY.md).
      - name: Run retrieval-hit regression check
        run: pytest eval/test_retrieval_hit.py -v
        env:
          EMBEDDING_BACKEND: local
          RETRIEVAL_MODE: hybrid
          USE_CONTEXTUAL_HEADERS: "true"
