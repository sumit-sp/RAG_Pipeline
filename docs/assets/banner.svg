<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EU AI Act Compliance Assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- subtle dot grid texture -->
  <g fill="#334155" opacity="0.45">
    <circle cx="40" cy="40" r="1.6"/><circle cx="80" cy="40" r="1.6"/><circle cx="120" cy="40" r="1.6"/>
    <circle cx="40" cy="80" r="1.6"/><circle cx="80" cy="80" r="1.6"/><circle cx="120" cy="80" r="1.6"/>
    <circle cx="40" cy="120" r="1.6"/><circle cx="80" cy="120" r="1.6"/><circle cx="120" cy="120" r="1.6"/>
    <circle cx="1080" cy="140" r="1.6"/><circle cx="1120" cy="140" r="1.6"/><circle cx="1160" cy="140" r="1.6"/>
    <circle cx="1080" cy="180" r="1.6"/><circle cx="1120" cy="180" r="1.6"/><circle cx="1160" cy="180" r="1.6"/>
    <circle cx="1080" cy="220" r="1.6"/><circle cx="1120" cy="220" r="1.6"/><circle cx="1160" cy="220" r="1.6"/>
  </g>

  <!-- mark: shield with a check, representing compliance -->
  <g transform="translate(64, 66)">
    <path d="M64 0 L124 22 V70 C124 108 100 134 64 148 C28 134 4 108 4 70 V22 Z"
          fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M38 74 L56 92 L92 50" fill="none" stroke="url(#accent)" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="232" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42"
        font-weight="600" fill="#f1f5f9">EU AI Act Compliance Assistant</text>

  <!-- subtitle -->
  <text x="234" y="156" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19"
        fill="#94a3b8">Retrieval-augmented answers over the AI Act, its amendments, and related guidance</text>

  <!-- tag row -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#38bdf8">
    <text x="234" y="192">Hybrid Retrieval</text>
    <text x="360" y="192">·</text>
    <text x="378" y="192">Qdrant</text>
    <text x="452" y="192">·</text>
    <text x="470" y="192">Groq</text>
    <text x="530" y="192">·</text>
    <text x="548" y="192">Evaluated &amp; Traced</text>
  </g>
</svg>
